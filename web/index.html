<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uma Introdução à Computação com Julia</title>
  <meta http-equiv="refresh" content="0; url=./pt/" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #5b5b5b;
      --accent: #9558b2;
      --border: #e2e2e2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14121a;
        --fg: #f2f0f5;
        --muted: #b7b2c2;
        --accent: #c58af2;
        --border: #302c3d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 2rem 1rem;
    }
    main {
      max-width: 30rem;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      line-height: 1.4;
      margin: 0 0 0.5rem;
    }
    p {
      color: var(--muted);
      margin: 0 0 1.75rem;
      font-size: 0.95rem;
    }
    .choices {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.lang {
      display: block;
      flex: 1 1 12rem;
      padding: 1rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      text-decoration: none;
      color: var(--fg);
      font-weight: 600;
    }
    a.lang span {
      display: block;
      font-weight: 400;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.2rem;
    }
    a.lang:hover, a.lang:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
    }
    noscript p { margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Uma Introdução à Computação com Julia<br />An Introduction to Computing with Julia</h1>
    <p>Redirecionando para a versão em Português… / Redirecting to the Portuguese edition…</p>
    <div class="choices">
      <a class="lang" href="./pt/">Português<span>Ler o livro em Português</span></a>
      <a class="lang" href="./en/">English<span>Read the book in English</span></a>
    </div>
  </main>
</body>
</html>
