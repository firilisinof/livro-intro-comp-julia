on:
  workflow_dispatch:
  push:
    branches: main

name: Publish Jupyter Book

env:
  # GitHub Pages serves this project from /<repository-name>/.
  BASE_PATH: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: jubook
          cache-environment: true

      - name: Install Julia
        shell: bash -el {0}
        run: juliaup add 1.11

      - name: Install Julia dependencies and kernel
        shell: bash -el {0}
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. -e 'using IJulia; installkernel("Julia Livro", "--project=${{ github.workspace }}")'

      - name: Build Portuguese website and PDF
        shell: bash -el {0}
        working-directory: pt
        env:
          BASE_URL: ${{ env.BASE_PATH }}/pt
        run: |
          jupyter book build --execute --html
          jupyter book build --typst --execute
          mkdir -p _build/html/downloads
          cp _build/exports/livro-intro-comp-julia.pdf _build/html/downloads/livro-intro-comp-julia.pdf

      - name: Build English website and PDF
        shell: bash -el {0}
        working-directory: en
        env:
          BASE_URL: ${{ env.BASE_PATH }}/en
        run: |
          jupyter book build --execute --html
          jupyter book build --typst --execute
          mkdir -p _build/html/downloads
          cp _build/exports/intro-computing-julia.pdf _build/html/downloads/intro-computing-julia.pdf

      - name: Assemble combined site
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp -R pt/_build/html _site/pt
          cp -R en/_build/html _site/en

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
